<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LiveOrder OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #020617;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .btn {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn:hover { background: #4338ca; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #334155; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 10px;
      margin: 14px 0;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(18px); }
    .status-msg {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">LiveOrder OS</span>
    <span id="badge-status" class="badge">Inactivo</span>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Auditor de Chat TikTok</span>
    <label class="switch">
      <input type="checkbox" id="toggle-auditoria">
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label>ID de Sesión Live</label>
    <input type="text" id="input-sesion" placeholder="UUID de la sesión activa">
    <button id="btn-detectar" class="btn btn-secondary">⚡ Detectar Sesión Activa</button>
  </div>

  <div class="field">
    <label>URL Backend</label>
    <input type="text" id="input-backend" value="http://localhost:3000">
  </div>

  <button id="btn-guardar" class="btn">Guardar Configuración</button>

  <p id="msg-feedback" class="status-msg"></p>

  <script src="popup.js"></script>
</body>
</html>
